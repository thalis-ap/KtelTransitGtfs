name: Process GTFS Upload

on:
  issues:
    types: [opened]

jobs:
  process-upload:
    # Only run if the issue has the label we defined in our form
    if: contains(github.event.issue.labels.*.name, 'gtfs-update')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Parse Issue Body, Map Region, and Check Authorization
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.actor;

            // 1. Map Users to Regions
            const userToRegion = {
              'ktel-lefkada': 'lefkada',
              'ktel-kefalonia': 'kefalonia',
              'thalis-ap': 'lefkada' // Temporarily mapped to lefkada so you can test
            };

            const region = userToRegion[actor];

            // If the user isn't in our map, kick them out
            if (!region) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ Permission Denied: @${actor}, your account is not authorized or mapped to a region.`
              });
              github.rest.issues.update({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'closed'
              });
              core.setFailed(`User @${actor} is not mapped to any region.`);
              return;
            }

            // 2. Extract the ZIP URL
            const body = context.payload.issue.body;
            
            const urlMatch = body.match(/\[.*?\.zip\]\((https:\/\/github\.com\/.*?)\)/);
            const url = urlMatch ? urlMatch[1].trim() : null;

            if (!url) {
              core.setFailed("Could not extract zip URL from the issue body.");
              return;
            }

            core.setOutput('region', region);
            core.setOutput('url', url);

      - name: Download and Replace File
        run: |
          REGION="${{ steps.parse.outputs.region }}"
          URL="${{ steps.parse.outputs.url }}"
          
          # Create directory just in case it doesn't exist
          mkdir -p "regions/$REGION"
          
          # Download the new zip, overwriting the old one
          curl -L -o "regions/$REGION/gtfs.zip" "$URL"
          
      - name: Commit and Push
        run: |
          REGION="${{ steps.parse.outputs.region }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "regions/$REGION/gtfs.zip"
          
          # Only commit if the file actually changed
          if git diff --cached --quiet; then
            echo "No changes in the downloaded zip file."
          else
            git commit -m "Update GTFS data for $REGION (Issue #${{ github.event.issue.number }})"
            git push
          fi

      - name: Close Issue and Notify
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ GTFS data successfully downloaded and committed to `regions/${{ steps.parse.outputs.region }}`! The manifest update workflow should start shortly to bump the version. Closing this issue."
            });
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
      - name: Trigger Manifest Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-manifest.yml
